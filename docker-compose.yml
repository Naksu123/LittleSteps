services:
  postgres:
    image: postgres:16-alpine
    container_name: littlesteps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-littlesteps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-littlesteps_dev}
      POSTGRES_DB: ${POSTGRES_DB:-littlesteps}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-littlesteps} -d ${POSTGRES_DB:-littlesteps}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: littlesteps-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-littlesteps}:${POSTGRES_PASSWORD:-littlesteps_dev}@postgres:5432/${POSTGRES_DB:-littlesteps}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-dev-secret-change-in-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_UPLOAD_DIR: /app/uploads
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
      ( [ \"$SEED_ON_START\" = \"true\" ] && python -m app.db.seed || true ) &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: littlesteps-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_uploads:
